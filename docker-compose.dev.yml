include:
  - docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./secrets/.env.dev
    command: npm run dev
    # Important: enable polling in Next.js if standard file watching fails inside docker
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8080:8080"
      - "5005:5005" # For remote debugging
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    env_file:
      - ./secrets/.env.dev
    depends_on:
      - redis
      - dynamodb-local
