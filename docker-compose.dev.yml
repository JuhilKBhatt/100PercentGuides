include:
  - docker-compose.yml

services:
  frontend:
    build:
      context: ./frontend
      target: development
    ports:
      - "3005:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./secrets/.env.dev
    command: npm run dev
    # Important: enable polling in Next.js if standard file watching fails inside docker
    environment:
      - CHOKIDAR_USEPOLLING=true

  backend:
    build:
      context: ./backend
      target: development
    ports:
      - "8080:8080"
      - "5005:5005" # For remote debugging
    volumes:
      - ./backend:/app
      - ~/.m2:/root/.m2
    env_file:
      - ./secrets/.env.dev
    depends_on:
      - redis
      - dynamodb-local

  # Automated Background Seeder for Top 100 Games (Warms Cache + Seeds Guides)
  seeder:
    image: python:3.11-alpine
    stop_grace_period: 30s
    restart: on-failure:3
    depends_on:
      - backend
    env_file:
      - ./secrets/.env.dev
    volumes:
      - ./scripts:/app/scripts
      - ./secrets:/app/secrets:ro
    working_dir: /app
    command: python3 -u scripts/seed_top_games.py --count 500 --ach-games-limit 100 --backend http://backend:8080
