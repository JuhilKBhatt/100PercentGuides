<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1c1917" />
      <stop offset="60%" stop-color="#0c0a09" />
      <stop offset="100%" stop-color="#050505" />
    </radialGradient>

    <!-- Brand Flame Gradient -->
    <linearGradient id="flameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Accent Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>

    <!-- Subtle Controller Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#27272a" />
      <stop offset="100%" stop-color="#141416" />
    </linearGradient>

    <!-- Outer Border Glow -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#f97316" flood-opacity="0.35" />
    </filter>

    <filter id="starGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#fbbf24" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="12" />

  <!-- Inner Ambient Glow Circle -->
  <circle cx="256" cy="256" r="160" fill="#f97316" opacity="0.08" filter="blur(24px)" />

  <!-- 100% Crown Badge at Top -->
  <g transform="translate(256, 115)" filter="url(#starGlow)">
    <!-- 100 Pill Badge -->
    <rect x="-68" y="-22" width="136" height="44" rx="22" fill="#18181b" stroke="url(#flameGrad)" stroke-width="4" />
    <text x="0" y="9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="900" fill="url(#goldGrad)" text-anchor="middle" letter-spacing="1">100%</text>
  </g>

  <!-- Main Gamepad Contour -->
  <g filter="url(#dropGlow)">
    <!-- Controller Outer Chassis -->
    <path d="M 148 185
             C 190 170, 322 170, 364 185
             C 415 200, 442 265, 426 338
             C 414 388, 365 408, 322 368
             C 292 338, 220 338, 190 368
             C 147 408, 98 388, 86 338
             C 70 265, 97 200, 148 185 Z"
          fill="url(#bodyGrad)"
          stroke="url(#flameGrad)"
          stroke-width="10"
          stroke-linejoin="round" />

    <!-- Top Left & Right Shoulder Bumpers -->
    <path d="M 148 175 C 160 160, 205 156, 218 160" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />
    <path d="M 364 175 C 352 160, 307 156, 294 160" stroke="#f97316" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.8" />

    <!-- Left D-Pad Cross -->
    <g transform="translate(155, 260)">
      <!-- Cross Horizontal -->
      <rect x="-30" y="-10" width="60" height="20" rx="5" fill="#f97316" />
      <!-- Cross Vertical -->
      <rect x="-10" y="-30" width="20" height="60" rx="5" fill="#f97316" />
      <!-- Center Indent -->
      <circle cx="0" cy="0" r="5" fill="#7c2d12" />
    </g>

    <!-- Right Action Buttons (Diamond Layout) -->
    <g transform="translate(357, 260)">
      <!-- Top Button (Y/Triangle) -->
      <circle cx="0" cy="-24" r="9" fill="url(#goldGrad)" />
      <!-- Bottom Button (A/Cross) -->
      <circle cx="0" cy="24" r="9" fill="url(#goldGrad)" />
      <!-- Left Button (X/Square) -->
      <circle cx="-24" cy="0" r="9" fill="url(#goldGrad)" />
      <!-- Right Button (B/Circle) -->
      <circle cx="24" cy="0" r="9" fill="url(#goldGrad)" />
    </g>

    <!-- Twin Thumbsticks (Analog Sticks) -->
    <!-- Left Stick -->
    <g transform="translate(210, 310)">
      <circle cx="0" cy="0" r="22" fill="#09090b" stroke="#3f3f46" stroke-width="4" />
      <circle cx="0" cy="0" r="14" fill="#18181b" stroke="#f97316" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
    </g>

    <!-- Right Stick -->
    <g transform="translate(302, 310)">
      <circle cx="0" cy="0" r="22" fill="#09090b" stroke="#3f3f46" stroke-width="4" />
      <circle cx="0" cy="0" r="14" fill="#18181b" stroke="#f97316" stroke-width="3" />
      <circle cx="0" cy="0" r="4" fill="#fbbf24" />
    </g>

    <!-- Center Menu / Guide Light -->
    <circle cx="256" cy="242" r="7" fill="#fbbf24" filter="url(#starGlow)" />
  </g>
</svg>