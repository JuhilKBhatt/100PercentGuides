name: Auto Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Pull and Update Containers
        run: |
          cd /var/www/100percentguides/
          git pull origin main
          sudo docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
          sudo docker image prune -f
