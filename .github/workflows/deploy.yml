name: Auto Deploy
on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy with Auto-Rollback
        run: |
          cd /var/www/100percentguides/

          # 1. Record current working commit
          PREV_COMMIT=$(git rev-parse HEAD)
          echo "Current working commit: $PREV_COMMIT"

          # 2. Pull new changes
          git pull origin main

          # 3. Build images first (without touching running containers)
          if ! docker compose -f docker-compose.prod.yml build; then
            echo "❌ Docker build failed! Reverting git to $PREV_COMMIT..."
            git reset --hard $PREV_COMMIT
            exit 1
          fi

          # 4. Swap to new containers
          docker compose -f docker-compose.prod.yml up -d --remove-orphans

          # 5. Health Check (Wait 15s, follow redirects with -L)
          echo "Waiting 15s for services to stabilize..."
          sleep 15

          if ! curl -fsSL http://localhost:3005 > /dev/null; then
            echo "❌ Health check failed! Containers crashed on startup."
            echo "🔄 Rolling back to previous working commit: $PREV_COMMIT..."
            git reset --hard $PREV_COMMIT
            docker compose -f docker-compose.prod.yml up -d --build --remove-orphans
            exit 1
          fi

          echo "✅ Deployment successful and verified healthy!"
          docker image prune -f
