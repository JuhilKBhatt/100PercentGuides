spring.application.name=backend

# Redis Configuration
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# AWS / DynamoDB Configuration
aws.region=${AWS_REGION:us-east-1}
aws.accessKeyId=${AWS_ACCESS_KEY_ID:test}
aws.secretAccessKey=${AWS_SECRET_ACCESS_KEY:test}
aws.dynamodb.endpoint=${DYNAMODB_ENDPOINT:http://dynamodb-local:8000}

# RAWG API Configuration
rawg.api.key=${RAWG_API_KEY:}
rawg.api.baseUrl=https://api.rawg.io/api

# Logging
logging.level.com.example.demo=INFO
